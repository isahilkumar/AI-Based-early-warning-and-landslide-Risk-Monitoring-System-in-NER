services:
  # 1. Backend REST API Web Service
  - type: web
    name: landsafener-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python seed_advanced_data.py
    startCommand: gunicorn landsafener_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"

  # 2. Frontend React/Vite Static Site
  - type: web
    name: landsafener-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: landsafener-backend
          property: host
          format: https://${host}/api
