services:
  # Single Unified Full-Stack Web Service (Frontend + Backend on ONE Link)
  - type: web
    name: landsafener
    runtime: python
    rootDir: .
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt && python manage.py migrate && python seed_advanced_data.py
    startCommand: cd backend && gunicorn landsafener_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: VITE_API_URL
        value: "/api"
